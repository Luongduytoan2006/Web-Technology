<html lang="en"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form name="form1">
        <select name="select1" id="">
            <option value="">item 0</option>
            <option value="">item 1</option>
            <option value="">item 2</option>
            <option value="">item 3</option>
        </select>
    
        <input type="text" name="text1">
        <input type="button" name="btn" value="Click Here">
    </form>
    
    <script>
        let btn = document.forms['form1'].btn;
        btn.addEventListener('click', function (e) {
            let index = document.forms['form1'].select1.selectedIndex;
            document.forms['form1'].text1.value = index;
            //alert(text);
        });
    </script>
</body>

</html>
