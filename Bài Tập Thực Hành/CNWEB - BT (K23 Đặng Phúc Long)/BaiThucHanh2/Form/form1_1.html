<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="styles/style1.css">
    
</head>
<body>
    
    <form name="form1">
        <h2>Login Here</h2>

        <label for="username">Username</label>
        <input name="username" type="text" placeholder="Email or Phone" id="username">
        
        <label for="password">Password</label>
        <input name="password" type="password" placeholder="Password" id="password">
        

        <div class="button">
            <button name="login">Log In</button>
            <button name="reset">Reset</button>
        </div>
        
        <div class="social">
          <div class="go"><i class="fab fa-google"></i>  Google</div>
          <div class="fb"><i class="fab fa-facebook"></i>  Facebook</div>
        </div>

    </form>
    <script>
        let login = document.forms["form1"].login;
        let reset = document.forms["form1"].reset;

        login.addEventListener('click' , function(e) {
            e.preventDefault();
            let username = document.forms["form1"].username.value;
            let password = document.forms["form1"].password.value;
            if (username === null || username.trim() === '') {
                alert("username is empty!");
                return;

            }
            if (password === null || password.trim() === '') {
                alert("password is empty!");
                return;
            }

            alert('login successfull!');

        });

        reset.addEventListener('click', function(e) {
            e.preventDefault();
            let username = document.forms["form1"].username.value = '';
            let password = document.forms["form1"].password.value = '';
        });


        
    </script>
</body>
</html>
