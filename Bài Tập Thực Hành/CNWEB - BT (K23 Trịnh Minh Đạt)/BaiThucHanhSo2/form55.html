<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        function showValue() {
            var sel = document.getElementById("selectBox");
            var txt = document.getElementById("txtValue");
            txt.value = sel.selectedIndex;
        }
    </script>
</head>

<body>
    <form>
        <select id="selectBox">
            <option>Index 0</option>
            <option>Index 1</option>
            <option>Index 2</option>
            <option>Index 3</option>
        </select>
        <input type="text" id="txtValue">
        <button type="button" onclick="showValue()">Click here</button>
    </form>
</body>

</html>
