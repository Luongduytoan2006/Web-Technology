<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
    background-color: aqua;
}
</style>
<body>
    <table>
        <caption> Ví dụ về tạo form  </caption>
        <tr>
            <th>Text box </th>
            <td> 
                <input type="text" name="userName">
            </td>
        </tr>
        <tr>
            <th>Text Area</th>
            <td>
                <textarea name="textArea" rows="10" cols="21"></textarea>
            </td>
        </tr>
        <tr>
            <th>File box</th>
            <td>
                <input type="file" name="Location">
                <button>Browse</button>
            </td>
        </tr>
        <tr>
            <td> <input type="radio"> Radio button </td>
        </tr>
        <tr>
            <td> <input type="checkbox"> Check box </td>
        </tr>
        <tr>
            <td>
                <button>Submit</button>
                <button>Reset</button>
            </td>
            
        </tr>
    </table>
</body>
</html>
