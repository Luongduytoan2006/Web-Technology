<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Form 22 - Đối tượng with trong JavaScript</title>
    <script language="JavaScript">
        // Define a function which will work as a method
        function AddPrice(amount) {
            with (this) {
                price = amount;
            }
        }

        function Book(title, author, content) {
            this.title = title;
            this.author = author;
            this.content = content;
            this.price = 0;
            this.AddPrice = AddPrice;
        }
    </script>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; line-height: 1.8;">
    <script language="JavaScript">
        var MyBook = new Book("Java", "Sun", "OOP");
        MyBook.AddPrice(500);

        document.write("Book title is : " + MyBook.title + "<br>");
        document.write("Book author is : " + MyBook.author + "<br>");
        document.write("Book content is : " + MyBook.content + "<br>");
        document.write("Book price is : " + MyBook.price + "<br>");
    </script>
</body>
</html>
