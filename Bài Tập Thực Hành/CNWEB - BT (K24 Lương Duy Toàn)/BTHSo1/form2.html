<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form style="background-color: #aadddd; padding: 15px; width: 350px;">
        <h3 align="center">VÍ DỤ VỀ TẠO FORM</h3>

        <table>
            <tr>
                <td>Text box:</td>
                <td><input type="text" size="20"></td>
            </tr>
            <tr>
                <td>Text Area:</td>
                <td><textarea rows="3" cols="20"></textarea></td>
            </tr>
            <tr>
                <td>File box:</td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td>Radio button:</td>
                <td><input type="radio" name="rd"></td>
            </tr>
            <tr>
                <td>Check box:</td>
                <td><input type="checkbox"></td>
            </tr>
        </table>
    </form>
</body>

</html>
