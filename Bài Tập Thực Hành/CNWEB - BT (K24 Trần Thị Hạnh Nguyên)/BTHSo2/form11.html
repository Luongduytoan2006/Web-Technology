<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <frame>
        <form class="form1" onsubmit="handleSubmit(event)">
            <div>
                <h1 class="title">Login</h1>
                <table>
                    <tr>
                        <td class="label">Username:</td>
                        <td><input type="text" id="username"></td>
                    </tr>


                    <tr>
                        <td class="label">Password:</td>
                        <td>
                            <input type="password" id="password">
                        </td>
                    </tr>
                    <tr>
                        <td class="button" colspan="2">
                            <button type="submit">OK</button>
                            <input type="reset" value="Reset">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <p style="color: red;" class="message"></p>
                        </td>
                    </tr>

                </table>
            </div>
        </form>
    </frame>
    <script>
        const message = document.querySelector('.message');
        const username = document.querySelector('#username');
        const password = document.querySelector('#password');
        function handleSubmit(e) {
            e.preventDefault();
            if (username.value.trim() === '' && password.value.trim() === '') {
                message.textContent = "Vui lòng nhập username và mật khẩu"
                return;
            }
            if (username.value.trim() === '') {
                message.textContent = "Vui lòng nhập username"
                return;
            }
            if (password.value.trim() === '') {
                message.textContent = "Vui lòng nhập mật khẩu"
                return;
            }
            alert("Đăng nhập thành công, username: " + username.value + ", password: " + password.value);

        }

    </script>
</body>

</html>
