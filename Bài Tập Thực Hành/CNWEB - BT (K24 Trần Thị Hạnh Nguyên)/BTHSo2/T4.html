<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bodyT4">
    <div class="contact-container">
        <!-- Ảnh nhỏ -->
        <div class="contact-image">
            <img src="https://img.freepik.com/vector-gratis/atencion-al-cliente-ilustracion-diseno-plano_23-2148887720.jpg?semt=ais_hybrid&w=740&q=80"
                alt="Liên hệ" />
        </div>

        <!-- Form liên hệ -->
        <h2>Liên hệ với tôi</h2>
        <form class="contact-form">
            <label for="name">Họ và tên</label>
            <input type="text" id="name" name="name" placeholder="Nhập họ tên..." required>

            <label for="email">Địa chỉ Email</label>
            <input type="email" id="email" name="email" placeholder="Nhập email..." required>

            <label for="message">Nội dung</label>
            <textarea id="message" name="message" rows="5" placeholder="Nhập nội dung liên hệ..." required></textarea>

            <button type="submit">Gửi liên hệ</button>
        </form>
    </div>
</body>

</html>
