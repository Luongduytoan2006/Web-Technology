<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test3 Login</title>

    <script>
        function Chuhoa() {
            var chuhoa = document.f1.t1.value;
            document.f1.t2.value = chuhoa.toUpperCase();
        }
    </script>
</head>

<body>
    <form name="f1" method="" action="">
        <input type="text" name="t1" value="" onBlur="Chuhoa()">
        <input type="text" name="t2" value="" style="width: 100px">
    </form>
</body>

</html>
