<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Demo 2 - Sự kiện Click cơ bản (Slide 6 - 10)</title>
    <script>
        // Hàm xử lý sự kiện khi bấm chuột
        function thongbao() {
            alert("Hello... Chúc mừng bạn đã bắt được sự kiện onclick!");
        }
    </script>
</head>
<body>
    <h3>Demo 2: Sự kiện onclick trên Button (Mẫu Slide 9-10)</h3>
    <p>Bấm nút bên dưới để kích hoạt sự kiện:</p>

    <form name="form1">
        <input type="button" value="Click here" onclick="thongbao()">
    </form>
</body>
</html>
